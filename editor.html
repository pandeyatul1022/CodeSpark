<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CodeSpark Block Editor — Drag-and-drop coding environment with live canvas, code preview, and sprite animations.">
  <title>CodeSpark — Block Editor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <!-- Blockly Library -->
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">
        <div class="logo-icon"><i class="fa-solid fa-bolt"></i></div>
        <span>Code<span class="text-gradient">Spark</span></span>
      </a>
      <div class="navbar-links" id="navLinks">
        <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
        <a href="editor.html" class="active"><i class="fa-solid fa-code"></i> Editor</a>
        <a href="tutorials.html"><i class="fa-solid fa-book-open"></i> Tutorials</a>
        <a href="quiz.html"><i class="fa-solid fa-brain"></i> Quiz</a>
      </div>
      <div class="navbar-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <i class="fa-solid fa-moon" id="themeIcon"></i>
        </button>
        <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Editor Page -->
  <div class="editor-page">
    <!-- Toolbar -->
    <div class="editor-toolbar">
      <div class="toolbar-group">
        <button class="toolbar-btn run-btn" id="runBtn" title="Run program (Ctrl+Enter)">
          <i class="fa-solid fa-play"></i> Run
        </button>
        <button class="toolbar-btn stop-btn" id="stopBtn" title="Stop program (Esc)">
          <i class="fa-solid fa-stop"></i> Stop
        </button>
        <div class="toolbar-separator"></div>
        <button class="toolbar-btn" id="resetSpriteBtn" title="Reset sprite position">
          <i class="fa-solid fa-rotate"></i> Reset
        </button>
        <button class="toolbar-btn" id="clearCanvasBtn" title="Clear canvas drawings">
          <i class="fa-solid fa-broom"></i> Clear
        </button>
      </div>
      <div class="toolbar-group">
        <div class="lang-selector" id="langSelector">
          <button class="active" data-lang="javascript"><i class="fa-brands fa-js"></i> JS</button>
          <button data-lang="python"><i class="fa-brands fa-python"></i> Py</button>
        </div>
        <div class="toolbar-separator"></div>
        <button class="toolbar-btn" id="saveBtn" title="Save project (Ctrl+S)">
          <i class="fa-solid fa-floppy-disk"></i> Save
        </button>
        <button class="toolbar-btn" id="loadBtn" title="Load project">
          <i class="fa-solid fa-folder-open"></i> Load
        </button>
        <div class="toolbar-separator"></div>
        <button class="toolbar-btn" id="undoBtn" title="Undo"><i class="fa-solid fa-rotate-left"></i></button>
        <button class="toolbar-btn" id="redoBtn" title="Redo"><i class="fa-solid fa-rotate-right"></i></button>
      </div>
    </div>

    <!-- Main Editor Area -->
    <div class="editor-main">
      <!-- Blockly Workspace -->
      <div class="blockly-panel" id="blocklyPanel">
        <div id="blocklyDiv"></div>
      </div>

      <!-- Right Side Panels -->
      <div class="right-panels">
        <!-- Canvas / Stage -->
        <div class="canvas-panel">
          <div class="canvas-header">
            <span><i class="fa-solid fa-masks-theater"></i> Stage</span>
            <span id="spriteCoords">x: 0, y: 0</span>
          </div>
          <div class="canvas-wrapper">
            <canvas id="spriteCanvas" width="380" height="280"></canvas>
          </div>
        </div>

        <!-- Code Preview -->
        <div class="code-panel">
          <div class="code-header">
            <div class="code-tabs">
              <button class="code-tab active" data-lang="javascript"><i class="fa-brands fa-js"></i> JavaScript</button>
              <button class="code-tab" data-lang="python"><i class="fa-brands fa-python"></i> Python</button>
            </div>
            <button class="toolbar-btn btn-sm" id="copyCodeBtn" title="Copy code" style="font-size: 0.7rem; padding: 0.2rem 0.5rem;">
              <i class="fa-regular fa-copy"></i> Copy
            </button>
          </div>
          <pre id="codeOutput">// Your generated code will appear here...\n// Drag blocks to the workspace to start coding!</pre>
          <div class="console-panel" id="consolePanel">
            <div class="console-line info"><i class="fa-solid fa-circle-check"></i> Console ready. Run your program to see output.</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Save Modal -->
  <div class="modal-overlay" id="saveModal">
    <div class="modal">
      <h2><i class="fa-solid fa-floppy-disk"></i> Save Project</h2>
      <label for="projectNameInput" class="visually-hidden">Project name</label>
      <input type="text" id="projectNameInput" class="modal-input" placeholder="Enter project name..." value="My CodeSpark Project">
      <div class="modal-actions">
        <button class="btn btn-secondary btn-sm" id="cancelSaveBtn">Cancel</button>
        <button class="btn btn-primary btn-sm" id="confirmSaveBtn"><i class="fa-solid fa-floppy-disk"></i> Save</button>
      </div>
    </div>
  </div>

  <!-- Load Modal -->
  <div class="modal-overlay" id="loadModal">
    <div class="modal">
      <h2><i class="fa-solid fa-folder-open"></i> Load Project</h2>
      <div class="saved-projects" id="savedProjectsList">
        <p style="color: var(--text-muted); text-align: center; padding: var(--space-xl);">No saved projects yet</p>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary btn-sm" id="cancelLoadBtn">Close</button>
      </div>
    </div>
  </div>

  <!-- Achievement Toast Container -->
  <div class="achievements-panel" id="achievementsPanel"></div>

  <script src="js/app.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/achievements.js"></script>
</body>
</html>
