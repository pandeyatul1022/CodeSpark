<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="CodeSpark Registration — Create a new account to save your coding projects, earn badges, and track your progress.">
  <title>Register — CodeSpark</title>
  <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/pages/auth.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">

  <!-- Official Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Official Apple Sign-In SDK -->
  <script type="text/javascript" src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>


</head>

<body data-auth-page="register">
  <!-- Navigation -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">
        CodeSpark
      </a>
      <div class="navbar-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="editor.html">Editor</a>
        <a href="tutorials.html">Tutorials</a>
        <a href="quiz.html">Quiz</a>
      </div>
      <div class="navbar-actions">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark theme"
          title="Switch to dark theme">
          <i class="bi bi-moon-stars-fill" aria-hidden="true"></i>
        </button>
        <div id="authContainer" class="auth-container">
          <a href="login.html" class="btn btn-primary btn-sm login-btn">
            <i class="bi bi-person-fill" aria-hidden="true"></i> Login
          </a>
        </div>
        <button class="mobile-menu-toggle" id="mobileMenuToggle" type="button" aria-label="Open menu"
          aria-controls="navLinks" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Register Page Content -->
  <main class="auth-page register-page">
    <div class="register-layout">
      <section class="register-story" aria-labelledby="registerStoryTitle">
        <h1 id="registerStoryTitle">Start creating.</h1>
        <img
          class="register-hero-image"
          src="assets/images/hero/hero-register-account.svg"
          alt="A new learner creating a CodeSpark account"
          decoding="async"
        >
      </section>

      <section class="auth-card register-card" aria-labelledby="registerTitle">
        <div class="auth-header">
          <div class="auth-icon-badge" aria-hidden="true">
            <i class="bi bi-person-plus"></i>
          </div>
          <h1 id="registerTitle">Create your account</h1>
          <p>Join <span class="text-gradient fw-bold">CodeSpark</span></p>
        </div>

        <div id="registerAlert" class="auth-alert" role="alert" aria-live="assertive"></div>

        <div class="social-buttons-row" aria-label="Other sign-up options">
          <button type="button" class="social-btn google-btn" id="googleRegBtn">
            <i class="bi bi-google" aria-hidden="true"></i><span>Google</span>
          </button>
          <button type="button" class="social-btn apple-btn" id="appleRegBtn">
            <i class="bi bi-apple" aria-hidden="true"></i><span>Apple</span>
          </button>
        </div>

        <div class="social-divider">
          <span>or sign up with email</span>
        </div>

        <form id="pageRegisterForm">
          <div class="row">
            <div class="col-md-6 form-group">
              <label for="regFullName">Full name</label>
              <input type="text" id="regFullName" class="form-control-custom" placeholder="Enter your name" required autocomplete="name">
            </div>
            <div class="col-md-6 form-group">
              <label for="regUsername">Username</label>
              <input type="text" id="regUsername" class="form-control-custom" placeholder="Enter your username" required autocomplete="username" autocapitalize="none" spellcheck="false">
            </div>
          </div>

          <div class="form-group">
            <label for="regEmail">Email address</label>
            <input type="email" id="regEmail" class="form-control-custom" placeholder="Enter your email" required autocomplete="email">
          </div>

          <input type="hidden" id="regRole" value="Student">

          <div class="row">
            <div class="col-md-6 form-group">
              <label for="regPassword">Password</label>
              <input type="password" id="regPassword" class="form-control-custom" placeholder="Create a strong password" required autocomplete="new-password">
            </div>
            <div class="col-md-6 form-group">
              <label for="regConfirmPassword">Confirm password</label>
              <input type="password" id="regConfirmPassword" class="form-control-custom" placeholder="Re-enter your password" required autocomplete="new-password">
            </div>
          </div>

          <div class="form-check register-terms">
            <input class="form-check-input" type="checkbox" id="termsCheck" required>
            <label class="form-check-label" for="termsCheck">
              I agree to the CodeSpark terms and learning policy
            </label>
          </div>

          <button type="submit" class="btn btn-primary auth-btn-submit" id="pageRegisterSubmitBtn">
            <span>Create account</span><i class="bi bi-arrow-right" aria-hidden="true"></i>
          </button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="login.html">Log in</a>
        </div>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer home-footer">
    <div class="container">
      <div class="home-footer-bottom">
        <p>
          © 2026 <a href="index.html" aria-label="CodeSpark home page">CodeSpark</a>. All rights reserved.
          <span aria-hidden="true">·</span>
          Designed by
          <!-- Replace the placeholder URL with Payal Dubey's portfolio URL. -->
          <a href="https://example.com" target="_blank" rel="noopener noreferrer">Payal Dubey</a>
        </p>
      </div>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/features/auth/auth.js"></script>
</body>

</html>
