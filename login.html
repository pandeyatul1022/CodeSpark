<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="CodeSpark Login — Log in to your account to save progress, unlock achievements, and manage your projects.">
  <title>Login — CodeSpark</title>
  <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/pages/auth.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">

</head>

<body data-auth-page="login">
  <!-- Navigation -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">
        CodeSpark
      </a>
      <div class="navbar-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="editor.html">Editor</a>
        <a href="tutorials.html">Tutorials</a>
        <a href="quiz.html">Quiz</a>
      </div>
      <div class="navbar-actions">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark theme"
          title="Switch to dark theme">
          <i class="bi bi-moon-stars-fill" aria-hidden="true"></i>
        </button>
        <div id="authContainer" class="auth-container">
          <a href="login.html" class="btn btn-primary btn-sm login-btn active">
            <i class="bi bi-person-fill" aria-hidden="true"></i> Login
          </a>
        </div>
        <button class="mobile-menu-toggle" id="mobileMenuToggle" type="button" aria-label="Open menu"
          aria-controls="navLinks" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Login Page Content -->
  <main class="auth-page login-page">
    <div class="login-layout">
      <section class="login-story" aria-labelledby="loginStoryTitle">
        <div class="login-story-content">
          <h1 id="loginStoryTitle">Your space to create.</h1>
        </div>
        <img
          class="login-hero-image"
          src="assets/images/hero/hero-login-account.svg"
          alt="A learner signing in to their CodeSpark account on a laptop"
          decoding="async"
        >
      </section>

      <section class="auth-card login-card" aria-labelledby="loginTitle">
        <div class="auth-header">
          <div class="auth-icon-badge" aria-hidden="true">
            <i class="bi bi-person-lock"></i>
          </div>
          <h2 id="loginTitle">Welcome back</h2>
          <p>Log in to your <span class="text-gradient fw-bold">CodeSpark</span> account</p>
          <p id="loginContextNotice" class="auth-context-notice" hidden></p>
        </div>

        <div id="loginAlert" class="auth-alert" role="alert" aria-live="assertive"></div>

        <form id="pageLoginForm">
          <div class="form-group">
            <label for="pageLoginUsername">Username or email</label>
            <input type="text" id="pageLoginUsername" class="form-control-custom" placeholder="Enter your username or email" required autocomplete="username" autocapitalize="none" spellcheck="false">
          </div>

          <div class="form-group">
            <label for="pageLoginPassword">Password</label>
            <input type="password" id="pageLoginPassword" class="form-control-custom" placeholder="Enter your password" required autocomplete="current-password">
          </div>

          <div class="login-form-options">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMeCheck" checked>
              <label class="form-check-label" for="rememberMeCheck">Remember me</label>
            </div>
          </div>

          <button type="submit" class="btn btn-primary auth-btn-submit" id="pageLoginSubmitBtn">
            <span>Log in</span><i class="bi bi-arrow-right" aria-hidden="true"></i>
          </button>
        </form>

        <div class="auth-footer">
          New to CodeSpark? <a href="register.html">Create an account</a>
        </div>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer home-footer">
    <div class="container">
      <div class="home-footer-bottom">
        <p>
          © 2026 <a href="index.html" aria-label="CodeSpark home page">CodeSpark</a>. All rights reserved.
          <span aria-hidden="true">·</span>
          Designed by
          <!-- Replace the placeholder URL with Payal Dubey's portfolio URL. -->
          <a href="https://example.com" target="_blank" rel="noopener noreferrer">Payal Dubey</a>
        </p>
      </div>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/features/auth/auth.js"></script>
</body>

</html>
